function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const ri=(R,a,b)=>a+Math.floor(R()*(b-a+1));
function blankDef(name,sw,sh,pal){ return {name,sw,sh,pal,gaps:[],platforms:[],walls:[],blocks:[],water:[],falls:[],doors:[],clears:[],keys:[],enemies:[],lava:[],hots:[],spawn:null,exit:null}; }

// ---- generators ----
// Tower: overlapping zig-zag ledges climbing to a top shelf; waterfall spouts give shortcuts up.
function genTower(name,sw,sh,pal,seed,opts={}){
  const R=rng(seed), d=blankDef(name,sw,sh,pal); const cols=Math.round(sw*32), rows=2+sh*26, L=2, Rt=cols-3, iw=cols-4;
  const lo=Math.ceil(iw*0.55), hi=Math.floor(iw*0.7);
  let side=0;
  for(let r=rows-5;r>=10;r-=4){
    const len=ri(R,lo,hi);
    d.platforms.push(side? [r,Rt-len+1,Rt] : [r,L,L+len-1]);
    if(iw>=28 && R()<0.45){ const m=ri(R,3,6), c=ri(R,L+4,Rt-4-m); d.platforms.push([r-2,c,c+m-1]); }
    if(opts.merlons && R()<0.5){ const c=side? Rt-len+1+ri(R,1,3) : L+len-2-ri(R,1,3); d.blocks.push([c,r-1,c,r-1]); }
    side^=1;
  }
  d.platforms.push([6,L,L+Math.min(8,iw-2)]); d.exit=[L+2,4]; d.spawn=[L+1,rows-2];
  const nf=opts.falls??Math.max(1,Math.floor(sh/2));
  for(let i=0;i<nf;i++){ const base=ri(R,14,rows-6), c=ri(R,L+2,Rt-2), top=Math.max(7,base-ri(R,10,16)); d.falls.push([c,top,base]); }
  const n=opts.enemies||Math.max(4,Math.round(sh*3.5*Math.max(1,sw)));
  for(let i=0;i<n;i++){ const pl=d.platforms[ri(R,0,d.platforms.length-2)]; d.enemies.push([ri(R,pl[1],pl[2]),pl[0]-1]); }
  return d;
}
// Cave: rough walls, descending ledges, pools, a locked floor-hatch near the bottom, exit at the very bottom.
function genCave(name,sw,sh,pal,seed,opts={}){
  const R=rng(seed), d=blankDef(name,sw,sh,pal); const cols=Math.round(sw*32), rows=2+sh*26, L=2, Rt=cols-3, iw=cols-4;
  for(let r=5;r<rows-4;r+=ri(R,2,4)){ const w=ri(R,1,3), h=ri(R,0,1); if(R()<0.5) d.blocks.push([L,r,L+w-1,r+h]); else d.blocks.push([Rt-w+1,r,Rt,r+h]); }
  const lo=Math.ceil(iw*0.5), hi=Math.floor(iw*0.68);
  let side=R()<0.5?0:1;
  for(let r=10;r<=rows-9;r+=ri(R,4,5)){ const len=ri(R,lo,hi); d.platforms.push(side? [r,Rt-len+1,Rt] : [r,L,L+len-1]); side^=1; }
  const pools=Math.max(1,Math.floor(sh/2));
  for(let i=0;i<pools;i++){ const pl=d.platforms[ri(R,1,d.platforms.length-2)]; if(pl[2]-pl[1]<9) continue; const a=pl[1]+2, b=pl[2]-2;
    d.blocks.push([a-1,pl[0]-2,a-1,pl[0]-1],[b+1,pl[0]-2,b+1,pl[0]-1]); d.water.push([a,pl[0]-2,b,pl[0]-1]); }
  d.platforms.push([6,L,L+6]); d.spawn=[L+1,5];
  const hatchRow=rows-7; d.platforms.push([hatchRow,L,Rt]);
  const gap=ri(R,L+4,Rt-6); d.doors.push([gap,hatchRow,gap+1,hatchRow,1]);
  { const ledges=d.blocks.filter(b=>b[1]>=Math.max(9,Math.floor(rows*0.45))&&b[1]<hatchRow-3); const good=ledges.filter(b=>{ const leftSide=b[0]===L; return d.platforms.some(pl=>pl[0]<b[1]&&pl[0]>=b[1]-7&&((leftSide&&pl[1]===L)||(!leftSide&&pl[2]===Rt))); });
    const pick=(good.length?good:ledges); if(pick.length){ const b=pick[ri(R,0,pick.length-1)]; d.keys.push([b[0]===L? b[2] : b[0], b[1]-1, 1]); }
    else { const kp=d.platforms[ri(R,1,Math.max(1,d.platforms.length-4))]; d.keys.push([kp[1]===L? kp[2] : kp[1],kp[0]-1,1]); } }
  d.water.push([L+1,rows-3,Math.floor(cols/2)-2,rows-2]); d.blocks.push([Math.floor(cols/2)-1,rows-3,Math.floor(cols/2)-1,rows-2]);
  d.exit=[Rt-4,rows-3];
  d.falls.push([Rt-1,9,hatchRow-1]);   // a spout along the right wall to get back up
  const n=opts.enemies||Math.max(4,Math.round(sh*3*Math.max(1,sw)));
  for(let i=0;i<n;i++){ const pl=d.platforms[ri(R,0,d.platforms.length-1)]; d.enemies.push([ri(R,pl[1],pl[2]),pl[0]-1]); }
  return d;
}
// Maze: a grid of rooms joined by a spanning tree (plus a few loops); locked doors on true bridges with keys on the near side.
function genMaze(name,sw,sh,pal,seed,opts={}){
  const R=rng(seed), d=blankDef(name,sw,sh,pal); const cols=Math.round(sw*32), rows=2+sh*26;
  const roomW=opts.roomW||10, roomH=opts.roomH||6, Wt=cols-4, Ht=rows-4;
  const nx=Math.max(1,Math.floor((Wt+1)/(roomW+1))), ny=Math.max(1,Math.floor((Ht+1)/(roomH+1)));
  const split=(total,n)=>{ const inner=total-(n-1), base=Math.floor(inner/n); let rem=inner-base*n; const out=[]; let st=0; for(let i=0;i<n;i++){ const w=base+(rem>0?1:0); if(rem>0) rem--; out.push([st,st+w-1]); st+=w+1; } return out; };
  const cxs=split(Wt,nx).map(([a,b])=>[a+2,b+2]), rys=split(Ht,ny).map(([a,b])=>[a+3,b+3]);
  for(let i=0;i<nx-1;i++) d.walls.push([cxs[i][1]+1,3,rows-2]);
  for(let j=0;j<ny-1;j++) d.platforms.push([rys[j][1]+1,2,cols-3]);
  const reach=[];
  for(let i=0;i<nx;i++){ reach.push([]); for(let j=0;j<ny;j++){ const [x0,x1]=cxs[i],[y0,y1]=rys[j], h=y1-y0+1; let span=[x0,x1];
    if(h>6){ let sd=R()<0.5; for(let r=y1-3;r>y0+1;r-=4){ const len=Math.max(3,Math.floor((x1-x0+1)*ri(R,45,65)/100)); const seg= sd? [r,x0,x0+len-1] : [r,x1-len+1,x1]; d.platforms.push(seg); span=[seg[1],seg[2]]; sd=!sd; } }
    else if(h>=5 && R()<0.4){ const len=ri(R,2,4), c=ri(R,x0+1,Math.max(x0+1,x1-len-1)); if(c+len-1<x1) d.platforms.push([y0+2,c,c+len-1]); }
    reach[i].push(span); } }
  const key=(i,j)=>i+','+j, seen=new Set(), edges=[]; const spawnRoom=[0,ny-1], exitRoom=opts.exitRoom||[nx-1,0];
  const stack=[spawnRoom.slice()]; seen.add(key(...spawnRoom));
  while(stack.length){ const [i,j]=stack[stack.length-1]; const nb=[[i+1,j,'h'],[i-1,j,'h'],[i,j+1,'v'],[i,j-1,'v']].filter(([a,b])=>a>=0&&a<nx&&b>=0&&b<ny&&!seen.has(key(a,b)));
    if(!nb.length){ stack.pop(); continue; } const [a,b,dir]=nb[ri(R,0,nb.length-1)]; seen.add(key(a,b)); edges.push({a:[i,j],b:[a,b],dir,tree:true}); stack.push([a,b]); }
  const same=(e,p2,q)=>(e.a[0]===p2[0]&&e.a[1]===p2[1]&&e.b[0]===q[0]&&e.b[1]===q[1])||(e.a[0]===q[0]&&e.a[1]===q[1]&&e.b[0]===p2[0]&&e.b[1]===p2[1]);
  const loops=opts.loops??0.15;
  for(let i=0;i<nx;i++) for(let j=0;j<ny;j++){
    if(i<nx-1 && R()<loops && !edges.some(e=>same(e,[i,j],[i+1,j]))) edges.push({a:[i,j],b:[i+1,j],dir:'h',tree:false});
    if(j<ny-1 && R()<loops && !edges.some(e=>same(e,[i,j],[i,j+1]))) edges.push({a:[i,j],b:[i,j+1],dir:'v',tree:false}); }
  for(const e of edges){
    if(e.dir==='h'){ const lo=e.a[0]<e.b[0]?e.a:e.b, wallC=cxs[lo[0]][1]+1, y1=rys[lo[1]][1]; e.cells=[wallC,y1-2,wallC,y1]; }
    else { const up=e.a[1]<e.b[1]?e.a:e.b, floorR=rys[up[1]][1]+1, lower=[up[0],up[1]+1]; let [sa,sb]=reach[lower[0]][lower[1]];
      const isExit=(up[0]===exitRoom[0]&&up[1]===exitRoom[1]); if(isExit) sa=Math.max(sa,cxs[up[0]][0]+4);
      sa=Math.max(sa,cxs[up[0]][0]+1); sb=Math.min(sb,cxs[up[0]][1]-3); if(sb<sa){ sa=cxs[up[0]][0]+4; sb=cxs[up[0]][1]-3; }
      const c=ri(R,sa,Math.max(sa,sb)); e.cells=[c,floorR,c+2,floorR]; }
    d.clears.push(e.cells);
  }
  d.spawn=[cxs[0][0]+1,rys[ny-1][1]]; d.exit=[cxs[exitRoom[0]][0]+1,rys[exitRoom[1]][1]-1];
  const adj=(closed)=>{ const m={}; for(const e of edges){ if(closed.includes(e)) continue; (m[key(...e.a)]=m[key(...e.a)]||[]).push(key(...e.b)); (m[key(...e.b)]=m[key(...e.b)]||[]).push(key(...e.a)); } return m; };
  const reachable=(closed)=>{ const m=adj(closed), st=[key(...spawnRoom)], out=new Set(st); while(st.length){ const k=st.pop(); for(const n2 of (m[k]||[])) if(!out.has(n2)){ out.add(n2); st.push(n2); } } return out; };
  const placed=[]; const cand=edges.filter(e=>e.tree).sort(()=>R()-0.5);
  for(const e of cand){ if(placed.length>=(opts.doors||0)) break; const side=reachable([...placed,e]); if(side.has(key(...exitRoom))||side.size<2) continue;
    const id=placed.length+1; e.doorId=id; placed.push(e);
    // farthest room from the start (by rooms walked) that is still on the open side of this door: an out-of-the-way detour
    const m=adj([...placed]); const dist={[key(...spawnRoom)]:0}; const q=[key(...spawnRoom)];
    while(q.length){ const k=q.shift(); for(const n2 of (m[k]||[])) if(dist[n2]===undefined && side.has(n2)){ dist[n2]=dist[k]+1; q.push(n2); } }
    const usedRooms=(d._keyRooms=d._keyRooms||[]); const fresh=[...side].filter(k=>!usedRooms.includes(k)); const pool=(fresh.length?fresh:[...side]);
    let best=null; for(const k of pool){ if(k===key(...spawnRoom)&&pool.length>1) continue; if(best===null||(dist[k]||0)>(dist[best]||0)||((dist[k]||0)===(dist[best]||0)&&R()<0.5)) best=k; }
    usedRooms.push(best);
    const kr=best.split(',').map(Number); const [x0,x1]=cxs[kr[0]], [y0,y1]=rys[kr[1]];
    const ledges=d.platforms.filter(([r,a,b])=>r>=y0&&r<=y1&&a>=x0-1&&b<=x1+1&&b-a>=1).sort((u,v)=>u[0]-v[0]);
    if(ledges.length){ const L2=ledges[0]; d.keys.push([ri(R,Math.max(L2[1],x0),Math.min(L2[2],x1)),L2[0]-1,id]); } else d.keys.push([R()<0.5?x0+1:x1-1,y1,id]); }
  for(const e of placed) d.doors.push([...e.cells,e.doorId]);
  for(let i=0;i<nx;i++) for(let j=0;j<ny;j++){ const [x0,x1]=cxs[i],[y0,y1]=rys[j]; const isSpawn=(i===0&&j===ny-1), isExit=(i===exitRoom[0]&&j===exitRoom[1]);
    if(!isSpawn&&!isExit&&R()<(opts.water||0)) d.water.push([x0,y1-1,x1,y1]);
    if(!isExit&&R()<(opts.falls||0)) d.falls.push([ri(R,x0+1,x1-1),y0,y1]); }
  const n=opts.enemies||Math.round(nx*ny*0.8);
  for(let k=0;k<n;k++){ const i=ri(R,0,nx-1), j=ri(R,0,ny-1); if(i===0&&j===ny-1) continue; d.enemies.push([ri(R,cxs[i][0]+1,cxs[i][1]-1),rys[j][1]]); }
  return d;
}
// Jumps: a chain of small platforms over a water pit; fall in and you swim back to the ladder. dir 'right' or 'up'.
function genJumps(name,sw,sh,pal,seed,opts={}){
  const R=rng(seed), d=blankDef(name,sw,sh,pal); const cols=Math.round(sw*32), rows=2+sh*26, dir=opts.dir||'right';
  d.water.push([2,rows-3,cols-3,rows-2]);
  let c=3, r=rows-6; d.platforms.push([r,2,7]); d.spawn=[3,r-1];
  let last=[r,2,7];
  for(let guard=0;guard<400;guard++){
    const len=ri(R,2,3); let nc,nr;
    if(dir==='right'){ nc=last[2]+ri(R,3,4)+1; nr=clamp(r+ri(R,-3,2),8,rows-7); if(nc+len>cols-4) break; }
    else { const dx=ri(R,3,4)+len, goRight=(last[1]+dx+len<cols-4) && (last[1]-dx<3 || R()<0.5); nc= goRight? last[2]+ri(R,3,4)+1 : last[1]-ri(R,3,4)-len; nr=r-ri(R,3,4); if(nr<8) break; nc=clamp(nc,3,cols-4-len); }
    const seg=[nr,nc,nc+len-1]; d.platforms.push(seg); last=seg; c=nc; r=nr;
  }
  d.platforms.push([last[0],last[1],last[1]+3]); d.exit=[last[1]+1,last[0]-2];
  for(let rr=rows-7;rr>rows-20;rr-=4) d.platforms.push([rr,2,ri(R,3,5)]);        // rescue ladder by the left wall
  if(dir==='right'){ for(let i=0;i<Math.max(2,Math.round(sw*2));i++){ const c2=ri(R,6,cols-8); d.falls.push([c2,ri(R,10,rows-14),rows-4]); } }   // spouts out of the pit
  else { for(let i=0;i<3;i++){ const pl=d.platforms[ri(R,2,d.platforms.length-3)]; const c2=clamp(pl[1]-2,3,cols-4); d.falls.push([c2,Math.max(6,pl[0]-14),pl[0]-1]); } }   // a few short boosts beside ledges
  const n=opts.enemies||Math.max(4,Math.round(d.platforms.length*0.35));
  for(let i=0;i<n;i++){ const pl=d.platforms[ri(R,1,d.platforms.length-1)]; d.enemies.push([ri(R,pl[1],pl[2]),pl[0]-1]); }
  return d;
}
// Hall: a long castle walk - battlement platforms, towers with doorways, moats and spouts.
function genHall(name,sw,pal,seed,opts={}){
  const R=rng(seed), d=blankDef(name,sw,1,pal); const cols=Math.round(sw*32), rows=28;
  let c=6;
  while(c<cols-40){
    const t=c+ri(R,24,34); if(t>cols-30) break;
    d.blocks.push([t,3,t+1,26]); d.clears.push([t,24,t+1,26]); d.clears.push([t,12,t+1,14]);    // tower with a ground door and a high door
    d.platforms.push([15,t-8,t-1],[15,t+2,t+9],[19,t-14,t-9],[23,t-6,t-1]);
    d.platforms.push([11,t+3,t+12]);
    if(R()<0.6){ const m0=c+ri(R,4,8), m1=Math.min(t-12,m0+ri(R,5,8)); if(m1>m0+2) d.water.push([m0,25,m1,26]); }
    if(R()<0.6) d.platforms.push([ri(R,6,8),c+ri(R,2,6),c+ri(R,10,14)]);
    d.falls.push([t+ri(R,12,16),8,26]);
    c=t+2;
  }
  d.platforms.push([22,cols-10,cols-4],[18,cols-14,cols-8],[14,cols-10,cols-4],[10,cols-14,cols-8],[6,cols-10,cols-3]);
  d.spawn=[3,26]; d.exit=[cols-6,4];
  const n=opts.enemies||Math.round(sw*3);
  for(let i=0;i<n;i++){ const pl=d.platforms[ri(R,0,d.platforms.length-1)]; d.enemies.push([ri(R,pl[1],pl[2]),pl[0]-1]); }
  for(let i=0;i<Math.round(sw);i++) d.enemies.push([ri(R,8,cols-8),26]);
  return d;
}

// Passage: solid rock with half-screen corridors carved through it as a winding maze of shafts and tunnels.
// Each cell is 12 x 11 tiles of air. Vertical shafts get zig-zag ledges (or a spout); tunnels get a step, a moat,
// and water that pours off a ledge stub down the shaft below as falling water ('f').
function genPassage(name,sw,sh,pal,seed,opts={}){
  const R=rng(seed), d=blankDef(name,sw,sh,pal); d.rock=true; d.flows=[];
  const nx=Math.max(1,Math.round(sw*2)), ny=Math.max(1,Math.round(sh*2));
  const cx0=i=>i*16+2, cx1=i=>i*16+13, ry0=j=>3+j*13, ry1=j=>ry0(j)+10;
  for(let i=0;i<nx;i++) for(let j=0;j<ny;j++) d.clears.push([cx0(i),ry0(j),cx1(i),ry1(j)]);
  const key=(i,j)=>i+','+j, depth=new Map(), conn={}; const start=[0,ny-1]; depth.set(key(...start),0);
  const link=(a,b)=>{ (conn[key(...a)]=conn[key(...a)]||[]).push(b); (conn[key(...b)]=conn[key(...b)]||[]).push(a); };
  const stack=[start]; let far=start, farD=0;
  while(stack.length){ const cur=stack[stack.length-1], [i,j]=cur;
    const nb=[[i+1,j],[i-1,j],[i,j+1],[i,j-1]].filter(([a,b])=>a>=0&&a<nx&&b>=0&&b<ny&&!depth.has(key(a,b)));
    if(!nb.length){ stack.pop(); continue; }
    const nxt=nb[ri(R,0,nb.length-1)], dep=depth.get(key(i,j))+1; depth.set(key(...nxt),dep); link(cur,nxt); if(dep>farD){ farD=dep; far=nxt; } stack.push(nxt); }
  const has=(i,j,di,dj)=>(conn[key(i,j)]||[]).some(([a,b])=>a===i+di&&b===j+dj);
  for(let i=0;i<nx;i++) for(let j=0;j<ny;j++){
    if(has(i,j,1,0)) d.clears.push([cx1(i)+1,ry1(j)-6,cx1(i)+4,ry1(j)]);          // tunnel, 7 tall
    if(has(i,j,0,1)) d.clears.push([cx0(i)+2,ry1(j)+1,cx0(i)+9,ry1(j)+2]);         // shaft opening, 8 wide, leaves stubs
  }
  d.spawn=[cx0(0)+1,ry1(ny-1)]; d.exit=[cx1(far[0])-1,ry1(far[1])-1];
  for(let i=0;i<nx;i++) for(let j=0;j<ny;j++){
    const X0=cx0(i),X1=cx1(i),Y0=ry0(j),Y1=ry1(j), up=has(i,j,0,-1), down=has(i,j,0,1);
    const isExit=(i===far[0]&&j===far[1]), isSpawn=(i===0&&j===ny-1);
    if(up||down){
      if(up && !isExit && R()<(opts.spouts??0.25)) d.falls.push([X0+5,Y0,Y1]);
      else { let sd=R()<0.5; for(const r of [Y1-3,Y1-7]){ d.platforms.push(sd? [r,X0,X0+6] : [r,X1-6,X1]); sd=!sd; } }
    } else {
      if(R()<0.6){ const len=ri(R,3,5), c=ri(R,X0+1,X1-len-1); d.platforms.push([Y1-4,c,c+len-1]); }
      if(!isExit&&!isSpawn&&R()<(opts.water??0.35)){ const a=ri(R,X0+2,X0+4), b=Math.min(X1-2,a+ri(R,3,5)); d.water.push([a,Y1,b,Y1]); }
    }
    if(down && !isExit && R()<(opts.flows??0.55)){
      if(R()<0.5){ d.water.push([X0,Y1,X0+1,Y1]); d.flows.push([X0+2,Y1]); } else { d.water.push([X0+10,Y1,X1,Y1]); d.flows.push([X0+9,Y1]); }
    }
    if(!isSpawn && R()<(opts.enemyChance??0.7)) d.enemies.push([ri(R,X0+1,X1-1),Y1]);
  }
  return d;
}


// ---- themed generators (rounds 61+) ----
// Theme flags read by the engine: theme (art + ambient), ice (slippery momentum), grav (gravity multiplier),
// wind (gusts that shove Bub and bubbles), steps (walk up 1-tile steps), props (decor set).
// Extra tiles: L lava (deadly, animated fire)  H hot platform (solid, but stand on it too long and you burn)
const forest=d=>{ d.theme='forest'; d.trees=true; d.props='bushy'; return d; };
const iced=d=>{ d.theme='ice'; d.ice=true; d.props='icy'; return d; };
const fiery=d=>{ d.theme='fire'; d.props='fiery'; return d; };

// Snake: a narrow winding shaft. Slabs jut in from alternating sides (or leave a hole in the middle), so the way up
// weaves left and right; thick slabs get a helper ledge, and spouts, stubs and troughs vary each turn.
function genSnake(name,sw,sh,pal,seed,opts={}){
  const R=rng(seed), d=blankDef(name,sw,sh,pal); const cols=Math.round(sw*32), rows=2+sh*26, L=2, Rt=cols-3, iw=cols-4;
  const step=opts.step||5, gapW=opts.gap||Math.max(4,Math.round(iw/3));
  let side=R()<0.5?0:1, i=0, floorRow=rows-1;
  if(opts.lava){ d.lava.push([L,rows-3,Rt,rows-2]); d.blocks.push([L,rows-3,L+4,rows-2]); d.spawn=[L+1,rows-4]; floorRow=rows-3; } else d.spawn=[L+1,rows-2];
  for(let r=floorRow-step; r>=9; r-=step, i++){
    const first=(i===0), thick=(!first && R()<0.35)?2:1, kind=(!first && R()<0.25)?'mid':'side';
    const g=clamp(gapW+ri(R,-1,1),3,iw-3);
    let gc0;   // first column of the gap
    if(kind==='mid'){ const m=L+Math.floor((iw-g)/2); d.blocks.push([L,r,m-1,r+thick-1],[m+g,r,Rt,r+thick-1]); gc0=m; }
    else if(side){ d.blocks.push([L+g,r,Rt,r+thick-1]); gc0=L; }
    else { d.blocks.push([L,r,Rt-g,r+thick-1]); gc0=Rt-g+1; }
    if(opts.hot && !first && R()<opts.hot){ const b=d.blocks[d.blocks.length-1]; d.hots.push([b[0],r,b[2],r]); if(kind==='mid'){ const b2=d.blocks[d.blocks.length-2]; d.hots.push([b2[0],r,b2[2],r]); } }
    if(thick===2) d.platforms.push([r+3,gc0,gc0+1]);            // can't jump through a thick slab: a step in the gap
    const roll=R();
    if(roll<(opts.spouts??0.18)){ d.falls.push([gc0+1,r-2,r+step-1]); }                                   // a spout rides you up through the gap
    else if(roll<0.45 && thick===2 && kind!=='mid'){ const a= side? L+g+2 : L+2, b=a+1; if(b<Rt-2){ d.blocks.push([a-1,r-2,a-1,r-1],[b+1,r-2,b+1,r-1]); (opts.lava? d.lava : d.water).push([a,r-2,b,r-1]); } }   // a trough on top of the slab
    else if(roll<0.7 && !first){ const sc= side? Rt-ri(R,1,2) : L+ri(R,1,2); d.blocks.push([sc,r-2,sc,r-2]); }   // a stub to hop over
    d.enemies.push([ side? Rt-ri(R,1,3) : L+ri(R,1,3), r-1 ]);
    side^=1;
  }
  d.platforms.push([6,L,L+5]); d.exit=[L+2,4];
  if(opts.wind) d.wind=opts.wind;
  return d;
}
// Hills: rolling stepped ground you can walk up, bushy with trees; taller levels stack thin ridge-hills with
// zig-zag branches between them. Exit at the top.
function genHills(name,sw,sh,pal,seed,opts={}){
  const R=rng(seed), d=forest(blankDef(name,sw,sh,pal||'forest')); d.steps=true;
  const cols=Math.round(sw*32), rows=2+sh*26, L=2, Rt=cols-3, iw=cols-4;
  const bands=Math.max(1,Math.round(sh)), bandH=Math.floor((rows-3)/bands), amp=opts.amp||2.4;
  let spawnH=1, baseTop=rows-1;
  for(let b=0;b<bands;b++){
    const base=rows-1-b*bandH, f1=R()*6.28, f2=R()*6.28, k1=0.14+R()*0.1, k2=0.3+R()*0.2, hs={};
    for(let c=L;c<=Rt;c++){ const raw=3.2+amp*Math.sin(c*k1+f1)+1.3*Math.sin(c*k2+f2), h=clamp(Math.round(raw),1,7); hs[c]=h;
      if(b===0) d.blocks.push([c,base-h,c,base-1]);
      else if(raw>2.6){ d.blocks.push([c,base-h,c,base-h+(raw>4.6?1:0)]); } else hs[c]=0; }
    if(b===0) spawnH=hs[L+1];
    baseTop=base;
    // enemies on the hilltops
    for(let k=0;k<Math.max(2,Math.round(iw/7));k++){ const c=ri(R,L+3,Rt-3); if(hs[c]) d.enemies.push([c,base-hs[c]-1]); }
    // branches climbing to the next ridge
    if(b<bands-1){ let side=R()<0.5?0:1; for(let r=base-10; r>=base-bandH+3; r-=4){ const len=ri(R,Math.round(iw*0.3),Math.round(iw*0.5)); d.platforms.push(side?[r,Rt-len+1,Rt]:[r,L,L+len-1]); side^=1; } }
  }
  // branches above the top ridge up to the exit shelf
  { let side=R()<0.5?0:1; for(let r=baseTop-10; r>=9; r-=4){ const len=ri(R,Math.round(iw*0.3),Math.round(iw*0.5)); d.platforms.push(side?[r,Rt-len+1,Rt]:[r,L,L+len-1]); if(R()<0.5) d.enemies.push([side? Rt-ri(R,1,len-1) : L+ri(R,1,len-1), r-1]); side^=1; } }
  d.platforms.push([6,Rt-7,Rt]); d.exit=[Rt-3,4]; d.spawn=[L+1,rows-2-spawnH];
  return d;
}
// City: skyscrapers standing on the street; zig-zag ledges climb the canyons between them, bridges span the narrow ones,
// and the exit sits on the roof of the tallest tower. Optional wind gusts.
function genCity(name,sw,sh,pal,seed,opts={}){
  const R=rng(seed), d=blankDef(name,sw,sh,pal||'city'); d.theme='city'; d.props='city'; if(opts.wind) d.wind=opts.wind;
  const cols=Math.round(sw*32), rows=2+sh*26, L=2, Rt=cols-3;
  const towers=[]; let c=L+ri(R,2,4);
  while(c+3<=Rt-2){ const w=cols<=16? 4 : ri(R,4,7); if(c+w-1>Rt-2) break; const h=ri(R,Math.round(rows*0.3),rows-10); towers.push({c0:c,c1:c+w-1,top:rows-1-h}); c+=w+ri(R,3,4); }
  if(!towers.length) towers.push({c0:L+4,c1:L+7,top:rows-12});
  const tall=towers[ri(R,0,towers.length-1)]; tall.top=7;
  for(const t of towers){ d.blocks.push([t.c0,t.top,t.c1,rows-2]); if(t!==tall && t.c1-t.c0>=4 && R()<0.5) d.blocks.push([t.c0+1,t.top-2,t.c0+2,t.top-1]); }   // water tanks on some roofs
  for(let k=0;k<=towers.length;k++){
    const A=k>0?towers[k-1]:null, B=k<towers.length?towers[k]:null;
    const g0=A?A.c1+1:L, g1=B?B.c0-1:Rt, width=g1-g0+1; if(width<2) continue;
    const tA=A?A.top:3, tB=B?B.top:3, lowRoof=Math.max(tA,tB), highRoof=Math.min(tA,tB), lw=Math.min(2,width);
    let side=R()<0.5?0:1;
    for(let r=rows-6; r>=highRoof+2; r-=4){
      if(r>lowRoof){ d.platforms.push(side? [r,g1-lw+1,g1] : [r,g0,g0+lw-1]); side^=1; }
      else d.platforms.push(tA<tB? [r,g0,g0+lw-1] : [r,g1-lw+1,g1]);
      if(R()<0.3) d.enemies.push([side? g1 : g0, r-1]);
    }
    if(width<=5 && A && B && R()<0.6){ const r=ri(R,Math.max(lowRoof+3,9),rows-8); d.platforms.push([r,g0,g1]); }
  }
  for(const t of towers){ if(t!==tall) d.enemies.push([ri(R,t.c0,t.c1),t.top-1]); }
  for(let i=0;i<Math.max(1,Math.round(sw));i++) d.enemies.push([ri(R,L+3,Rt-3),rows-2]);
  d.spawn=[L+1,rows-2]; d.exit=[tall.c0+1,5];
  return d;
}
// Space: drifting asteroids under a different gravity. Low gravity spreads them far apart (huge floaty jumps);
// heavy gravity packs them close together (short hops). Some low-gravity fields wrap top to bottom.
function genSpace(name,sw,sh,pal,seed,opts={}){
  const R=rng(seed), d=blankDef(name,sw,sh,pal||'space'); d.theme='space'; d.props='space'; d.grav=opts.grav||0.4;
  const cols=Math.round(sw*32), rows=2+sh*26, L=2, Rt=cols-3, iw=cols-4, heavy=d.grav>1;
  const vs= heavy? 2 : clamp(Math.round(JUMP_V*JUMP_V/(2*GRAV*d.grav)/TILE*0.65),5,14), hs= heavy? 2 : 5;
  d.blocks.push([L,rows-4,L+4,rows-2]); d.spawn=[L+1,rows-5];
  const rocks=[];
  for(let r=rows-4-vs; r>=9; r-=vs+ri(R,-1,1)){
    let c=L+ri(R,0,3);
    while(c<Rt-1){ const w= heavy? ri(R,2,4) : ri(R,2,5), h=(!heavy&&R()<0.3)?2:1; const c1=Math.min(Rt,c+w-1); d.blocks.push([c,r,c1,r+h-1]); rocks.push([r,c,c1]); c=c1+1+ri(R,hs-1,hs+2); }
  }
  d.blocks.push([Rt-6,6,Rt,7]); d.exit=[Rt-4,4];
  if(!heavy && R()<0.6){ const m=Math.floor(cols/2); d.gaps.push([m-3,m+2]); }
  const n=Math.max(4,Math.round(rocks.length*0.45));
  for(let i=0;i<n;i++){ const rk=rocks[ri(R,0,rocks.length-1)]; d.enemies.push([ri(R,rk[1],rk[2]),rk[0]-1]); }
  return d;
}
// Fire: a lava lake with stepping stones (some of them burning), then ledges climbing past lava troughs and fire geysers.
function genFire(name,sw,sh,pal,seed,opts={}){
  const R=rng(seed), d=fiery(blankDef(name,sw,sh,pal||'ember'));
  const cols=Math.round(sw*32), rows=2+sh*26, L=2, Rt=cols-3, iw=cols-4;
  d.lava.push([L,rows-3,Rt,rows-2]);
  d.blocks.push([L,rows-3,L+4,rows-2]); d.spawn=[L+1,rows-4];
  d.blocks.push([Rt-4,rows-3,Rt,rows-2]);
  let c=L+5+ri(R,2,3), r=rows-6;
  while(c+2<=Rt-6){ const len=ri(R,2,4), seg=[r,c,Math.min(Rt-6,c+len-1)]; if(R()<0.45) d.hots.push([seg[1],r,seg[2],r]); else d.platforms.push(seg); if(R()<0.5) d.enemies.push([seg[1],r-1]); c=seg[2]+1+ri(R,3,4); r=clamp(r+ri(R,-2,2),rows-9,rows-5); }
  let side=R()<0.5?0:1;
  for(let rr=rows-11; rr>=9; rr-=4){
    const len=ri(R,Math.ceil(iw*0.45),Math.floor(iw*0.65)); const seg= side? [rr,Rt-len+1,Rt] : [rr,L,L+len-1];
    if(R()<0.3) d.hots.push([seg[1],rr,seg[2],rr]); else d.platforms.push(seg);
    if(len>=10 && R()<0.45){ const a=seg[1]+ri(R,2,len-6), b=a+ri(R,1,2); d.blocks.push([a-1,rr-2,a-1,rr-1],[b+1,rr-2,b+1,rr-1]); d.lava.push([a,rr-2,b,rr-1]); }
    if(R()<(opts.geysers??0.35)){ const sc= side? Rt-len-1 : L+len+1; if(sc>L&&sc<Rt) d.falls.push([sc,Math.max(5,rr-8),rr+3]); }
    d.enemies.push([ri(R,seg[1],seg[2]),rr-1]);
    side^=1;
  }
  d.platforms.push([6,L,L+6]); d.exit=[L+2,4];
  return d;
}

function makeLevel(def){
  for(const k of ['gaps','platforms','walls','blocks','water','falls','doors','clears','keys','enemies','lava','hots']) if(!def[k]) def[k]=[];
  const cols=Math.round(def.sw*32), rows=2+Math.round(def.sh*26);
  const grid=[]; for(let r=0;r<rows;r++) grid.push(new Array(cols).fill('.'));
  const inb=(c,r)=>r>=0&&r<rows&&c>=0&&c<cols;
  const fill=(c0,r0,c1,r1,ch,onlyAir=false)=>{ for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) if(inb(c,r) && (!onlyAir||grid[r][c]==='.')) grid[r][c]=ch; };
  fill(0,2,1,rows-1,'W'); fill(cols-2,2,cols-1,rows-1,'W');
  fill(2,2,cols-3,2,'W'); fill(2,rows-1,cols-3,rows-1,'W');
  for(const [g0,g1] of def.gaps){ fill(g0,2,g1,2,'.'); fill(g0,rows-1,g1,rows-1,'.'); }
  if(def.rock) fill(2,3,cols-3,rows-2,'W');
  for(const [r,c0,c1] of def.platforms) fill(c0,r,c1,r,'#');
  for(const [c,r0,r1] of def.walls) fill(c,r0,c,r1,'#');
  for(const [c0,r0,c1,r1] of def.blocks) fill(c0,r0,c1,r1,'#');
  for(const [c0,r0,c1,r1] of def.hots) fill(c0,r0,c1,r1,'H');

let actx=null, master=null, noiseBuf=null, muted=false;
function initAudio(){
  if(actx) return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=0.5; master.connect(actx.destination);
    noiseBuf=actx.createBuffer(1,actx.sampleRate*0.3,actx.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    startMusic();
  }catch(e){ console.warn('audio unavailable',e); }
}
function tone(type,f0,f1,dur,vol,when=0){
  if(!actx||muted) return;
  const t=actx.currentTime+when, o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0005,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur,vol,when=0){
  if(!actx||muted) return;
  const t=actx.currentTime+when, s=actx.createBufferSource(), g=actx.createGain(), f=actx.createBiquadFilter();
  s.buffer=noiseBuf; f.type='highpass'; f.frequency.value=1500;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0005,t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+0.02);
}

  g.gain.setValueAtTime(vol,t); g.gain.setValueAtTime(vol,t+dur*0.6); g.gain.exponentialRampToValueAtTime(0.0005,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02); }

// e: {x (centre), y (feet), w, h, vx, vy, onGround, hitWall}
function physicsStep(e){
  const mid=tileAt(col(e.x),row(e.y-e.h/2));
  e.inWater = mid==='w'; e.inFall = mid==='F';
  e.inFlow = mid==='f';
  if(e.inFall) e.vy=Math.max(e.vy-0.5,-4.4);                 // waterfall spout: launched upward
  else if(e.inFlow) e.vy=Math.min(e.vy+0.3,3.6);              // falling water: swept downward
  else if(e.inWater) e.vy=Math.min(e.vy+0.05,0.8);           // swimming: gentle sink
  else { const gm=level.def.grav||1; e.vy=Math.min(e.vy+GRAV*gm,MAXFALL*(gm>1?1.4:1)); }
  const rising=e.vy<0;
  const cL=col(e.x-e.w/2+1), cR=col(e.x+e.w/2-1);
  let ny=e.y+e.vy;
  e.onGround=false;
  if(!rising){
    const rStart=Math.max(0,row(e.y-e.h*0.6)), rEnd=row(ny);

// ---- bosses: a giant monster every 5th round, Super Drunk every 10th. They can't be bubbled; fresh bubbles burst on them and take a hit point ----

class Boss extends Enemy{

function spawnBoss(){

function hitBossCheck(b){

    if(circleRect({x:b.x,y:b.y,r:b.r+1},e,0)){ e.hit(b); const i=bubbles.indexOf(b); if(i>=0) bubbles.splice(i,1); return true; } }
  return false;
}
// ---- monster projectiles: rolling rocks, dropped lasers, fire breath, thrown bottles ----
function updateShots(){
  for(const sh of shots){
    sh.life--;
    if(sh.type==='rock'){ sh.hitWall=false; physicsStep(sh); if(sh.hitWall) sh.vx=-sh.vx*0.7; if(sh.onGround && Math.abs(sh.vx)<0.2) sh.life=Math.min(sh.life,20); }
    else if(sh.type==='bottle'){ sh.vy+=0.12; sh.x+=sh.vx; sh.y+=sh.vy;
      if(solidAt(col(sh.x),row(sh.y-1)) || solidAt(col(sh.x+sgn(sh.vx)*4),row(sh.y-5))){ sh.life=0; for(let i=0;i<5;i++) particles.push({type:'dot',x:sh.x,y:sh.y-4,vx:rnd(-1,1),vy:rnd(-1.5,0),life:14,max:14,color:'#a0e0ff'}); } }
    else if(sh.type==='laser'){ sh.y+=sh.vy; if(solidAt(col(sh.x),row(sh.y))) sh.life=0; }
    else if(sh.type==='fire'){ sh.x+=sh.vx; if(solidAt(col(sh.x+sh.dir*6),row(sh.y-6))) sh.life=0; }
    if(sh.y-sh.h>LH*TILE) sh.life=0;
    for(const p of players){ if(p.state==='alive' && p.inv<=0 && sh.life>0 && rectOverlap(p,{x:sh.x,y:sh.y,w:sh.w,h:sh.h},1)) p.die(); }
  }

}

    else if(sh.type==='laser'){ ctx.fillStyle=(frameCount&2)?'#80f0ff':'#ffffff'; ctx.fillRect(Math.round(sh.x)-1,Math.round(sh.y-sh.h),2,sh.h); }

    else if(sh.type==='bottle'){ const img=frame('fx_bottle',(frameCount>>3)%2,sgn(sh.vx)||1); if(img) ctx.drawImage(img,Math.round(sh.x-8),Math.round(sh.y-14)); }
  }
}

// ===================== bubbles =====================
function spawnBubble(p){
  const b={x:p.x+p.facing*9,y:p.y-9,r:3,vx:p.facing*BUB_SPEED*(p.hasCandy('blue')?1.6:1),vy:0,phase:'shoot',age:0,owner:p,enemy:null,trapT:0,
    popping:false,popDelay:0,popper:null,chain:null,seed:Math.random()*100,atTop:false,squash:0,slideDir:0,blockedUp:false,decay:p.hasCandy('pink')?0.97:BUB_DECAY,thunder:thunderMode,dir:p.facing};
  bubbles.push(b); stats.blown++; S.blown++;
  if(bubbles.length>MAX_BUBBLES){ const old=bubbles.find(o=>!o.popping&&!o.enemy); if(old) startPop(old,null,false); }
  SFX.blow();
}
// a fresh bubble captures any enemy it touches (checked at the old and new position so fast shots can't skip past)
function tryTrap(b,px){
  if(b.enemy||b.special) return;
  const probe={x:px,y:b.y,r:Math.max(b.r,6)+1};
  for(const e of enemies){
    if(e.state!=='alive'||e.trapped||e.boss) continue;
    if(circleRect({x:b.x,y:b.y,r:b.r+1},e,0) || circleRect(probe,e,0)){ trap(b,e); return; }
  }
}
function trap(b,e){ b.enemy=e; e.trapped=true; e.vx=0; e.vy=0; b.phase='float'; b.vx*=0.3; b.trapT=0; b.r=BUB_R+1; b.squash=1; SFX.trap(); }
function releaseEnemy(b){
  const e=b.enemy; b.enemy=null; e.trapped=false; e.angry=true; e.x=b.x; e.y=b.y+7; e.vy=-1.5; e.dir=Math.random()<0.5?-1:1;
  spawnPopParticles(b,'#ff6060'); const i=bubbles.indexOf(b); if(i>=0) bubbles.splice(i,1); SFX.escape();
}
function bubbleTiles(b){
  const r=b.r;
  b.blockedUp=false;
  if(solidAt(col(b.x),row(b.y-r))){ b.y=(row(b.y-r)+1)*TILE+r; if(b.vy<0) b.vy=0; b.blockedUp=true; }
  if(b.y<3*TILE+r){ b.y=3*TILE+r; if(b.vy<0) b.vy=0; b.blockedUp=true; }
  if(solidAt(col(b.x),row(b.y+r-1))) b.y=row(b.y+r-1)*TILE-r;
  if(solidAt(col(b.x-r),row(b.y))){ b.x=(col(b.x-r)+1)*TILE+r; if(b.vx<0) b.vx=0; }
  if(solidAt(col(b.x+r-1),row(b.y))){ b.x=col(b.x+r-1)*TILE-r; if(b.vx>0) b.vx=0; }
  b.x=clamp(b.x,2*TILE+r,LW*TILE-2*TILE-r);
}
// distance (in tiles) to the nearest opening in the row above, walking in direction d; Infinity if a wall blocks the way
function openingDist(b,d){
  const r=row(b.y), ra=row(b.y-b.r); const c0=col(b.x);
  for(let i=1;i<=LW;i++){
    const c=c0+i*d;
    if(c<2||c>LW-3) return Infinity;
    if(solidAt(c,r)||solidAt(c,r-1)) return Infinity;
    if(!solidAt(c,ra)) return i;
  }
  return Infinity;
}
function updateBubble(b){
  b.age++;
  if(b.squash>0) b.squash=Math.max(0,b.squash-0.08);
  if(b.popping){ if(--b.popDelay<=0) doPop(b); return; }
  if(b.phase==='shoot'){
    b.r=Math.min(BUB_R,b.r+1.5);
    const px=b.x;
    b.x+=b.vx; b.vx*=(b.decay||BUB_DECAY);
    const before=b.x; bubbleTiles(b);
    if(b.x!==before || Math.abs(b.vx)<0.25){ b.phase='float'; b.vx*=0.3; }
    if(hitBossCheck(b)) return;
    tryTrap(b,px);
  } else {
    if(b.age<BUB_ACTIVE && !b.enemy){ if(hitBossCheck(b)) return; tryTrap(b,b.x); }
    const targetVy = b.enemy? -0.22 : b.special? -0.12 : -0.3;
    const bt=tileAt(col(b.x),row(b.y)); if(bt==='F') b.vy=Math.max(b.vy-0.3,-2.4); else if(bt==='f') b.vy=Math.min(b.vy+0.2,1.6);
    if(bt==='L'||tileAt(col(b.x),row(b.y+b.r+2))==='L') b.vy=Math.max(b.vy-0.35,-2.2);   // heat rising off lava
    b.vx+=windNow()*0.05;
    b.vy += (targetVy-b.vy)*0.05;
    const wobble=Math.sin(b.age*0.05+b.seed)*0.12;
    b.y+=b.vy;
    b.x+=b.vx+wobble;
    bubbleTiles(b);
    if(b.blockedUp){
      const atCeiling = b.y<=3*TILE+b.r+0.5;
      if(atCeiling){
        b.atTop=true;
        const dx=LW*TILE/2-b.x;
        if(Math.abs(dx)>6) b.vx+=sgn(dx)*0.012;
        b.vx+=rnd(-0.01,0.01);
      } else {
        if(b.slideDir===0 || (b.age%30)===0){
          const dl=openingDist(b,-1), dr=openingDist(b,1);
          b.slideDir = dl===Infinity&&dr===Infinity ? 0 : dl<=dr?-1:1;
        }
        if(b.slideDir) b.vx+=b.slideDir*0.035;
      }
      b.vx=clamp(b.vx,-0.35,0.35);
    } else { b.slideDir=0; b.atTop=false; }
    b.vx*=0.96;
    if(b.enemy){ b.trapT++; if(b.trapT>BUB_ESCAPE) releaseEnemy(b); }
    else if(b.age>(b.special?BUB_LIFE*3:BUB_LIFE)) startPop(b,null,false);
  }
  if(b.enemy){ b.enemy.x=b.x; b.enemy.y=b.y+8; }
}
function resolveBubbles(){
  const n=bubbles.length;
  for(let i=0;i<n;i++){
    const a=bubbles[i]; if(a.popping) continue;
    for(let j=i+1;j<n;j++){
      const b=bubbles[j]; if(b.popping) continue;
      const dx=b.x-a.x, dy=b.y-a.y, min=a.r+b.r-1, d2=dx*dx+dy*dy;
      if(d2<min*min && d2>0.0001){
        const d=Math.sqrt(d2), push=(min-d)*0.2, nx=dx/d, ny=dy/d;
        const wa=a.phase==='shoot'?0:1, wb=b.phase==='shoot'?0:1, tot=(wa+wb)||1;
        a.x-=nx*push*wa/tot; a.y-=ny*push*wa/tot; b.x+=nx*push*wb/tot; b.y+=ny*push*wb/tot;
      }
    }
  }
  for(const b of bubbles){ if(!b.popping) bubbleTiles(b); }
}
function startPop(b,popper,chain){
  if(b.popping) return;
  b.popping=true; b.popDelay=0; b.popper=popper; b.chainable=chain; b.chain=b.chain||{count:0,kills:0};
}
function doPop(b){
  const i=bubbles.indexOf(b); if(i>=0) bubbles.splice(i,1);
  spawnPopParticles(b, b.owner? '#a0ffa0':'#ffffff');
  SFX.pop(b.chain.count); b.chain.count++; stats.popped++; if(S) S.popped++;
  if(b.thunder && !b.enemy && !b.special) fireBolt(b.x,b.y,b.dir||1);
  if(b.chain.count>stats.biggestChain) stats.biggestChain=b.chain.count;
  if(b.enemy) killEnemy(b.enemy,b.chain,b.popper,b);
  else if(b.popper) b.popper.score+=10;
  if(b.chainable){
    for(const o of bubbles){ if(o.popping) continue; const d=Math.hypot(o.x-b.x,o.y-b.y); if(d<o.r+b.r+2){ o.popping=true; o.popDelay=3; o.chain=b.chain; o.popper=b.popper; o.chainable=true; } }
  }
}
function killEnemy(e,chain,popper,b){
  e.trapped=false; e.state='dead';
  const i=enemies.indexOf(e); if(i>=0) enemies.splice(i,1);
  chain.kills++;
  const def=pickFood(chain.kills);
  const dir= popper? sgn(b.x-popper.x)||1 : (Math.random()<0.5?-1:1);
  fruits.push({x:b.x,y:b.y+6,w:10,h:12,vx:dir*1.1,vy:-2.4,def,value:def.value,age:0,dead:false,onGround:false,hitWall:false,bounces:0,fromEnemy:true});
  if(popper) popper.score+=100;
  SFX.kill();
}
function touchBubbles(p){
  for(const b of bubbles){
    if(b.popping) continue;
    if(b.owner===p && b.age<14) continue;
    if(!circleRect(b,p,1.5)) continue;
    if(b.special){ popSpecial(b,p); continue; }
    if(p.jumpHeld){
      if(p.vy>0 && p.y<=b.y+2){
        p.vy=-BOUNCE_V; p.onGround=false; p.y=Math.min(p.y,b.y-b.r+4);
        b.vy+=0.9; b.squash=1; stats.bounces++; SFX.bounce();
        return;
      } else {
        const sx=sgn(b.x-p.x)||1; b.vx+=sx*0.25; if(b.y<p.y-p.h) b.vy-=0.15; else b.vy+=0.15;
      }
    } else {
      // walking into a bubble shoves it along; it bursts when squeezed against a wall (or a pile pinned to one).
      // jumping/falling into a bubble, or standing still while one drifts into you, pops it outright.
      const dir=sgn(p.vx);
      const walking = p.onGround && dir!==0 && sgn(b.x-p.x)===dir && b.y>p.y-p.h-3 && b.y<p.y+3;
      if(walking){
        const gap=p.w/2+b.r-2;
        const depth=gap-dir*(b.x-p.x);          // how far the bubble is jammed into Bub
        b.squeeze = depth>2.5 ? (b.squeeze||0)+1 : 0;
        b.x=p.x+dir*gap; b.vx=dir*0.4; b.y=p.y-9; b.vy=0;   // shoved along at mouth height
        bubbleTiles(b);
        const pinned = dir*(b.x-(p.x+dir*gap)) < -2;   // a wall stopped it from moving ahead
        if(pinned || b.squeeze>=4) startPop(b,p,true);
      } else {
        startPop(b,p,true);
      }
    }
  }
}

// ===================== fruit, particles, popups =====================
function updateFruit(f){

function spawnPopParticles(b,color){

function updateParticles(){

function addPopup(x,y,text,color){ popups.push({x,y,text,color,life:60}); }

// ===================== items: food, chain bonuses, special items, special bubbles =====================
// Values follow the arcade item table: foods advance with the round, chain pops hand out the bonus fruits and diamonds,
// bubbles left over when a round is won can turn into 700-point items, bonus stages fill with 500-point ones, and the
// "big" versions are huge (about ten Bubs tall) and worth a fortune. Every special item has a function and a condition.
function makeIcon(shape,a,b,c){
  const cv=document.createElement('canvas'); cv.width=12; cv.height=12; const g=cv.getContext('2d');
  b=b||'#ffffff'; c=c||'#2fa82f';
  const R=(x,y,w,h,col)=>{ g.fillStyle=col; g.fillRect(x,y,w,h); };
  const C=(x,y,r,col)=>{ g.fillStyle=col; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); };
  const E=(x,y,rx,ry,col,rot=0)=>{ g.fillStyle=col; g.beginPath(); g.ellipse(x,y,rx,ry,rot,0,Math.PI*2); g.fill(); };
  const T=(p,col)=>{ g.fillStyle=col; g.beginPath(); g.moveTo(p[0],p[1]); for(let i=2;i<p.length;i+=2) g.lineTo(p[i],p[i+1]); g.closePath(); g.fill(); };
  const HC=(x,y,r,col)=>{ g.fillStyle=col; g.beginPath(); g.arc(x,y,r,Math.PI,0); g.fill(); };
  const cut=(x,y,r)=>{ g.globalCompositeOperation='destination-out'; C(x,y,r,'#000'); g.globalCompositeOperation='source-over'; };
  switch(shape){
    case 'round': C(6,7,4.5,a); C(4.5,5.5,1.2,b); R(5.5,1,1,3,'#5a3a1a'); E(7.5,2,2,1,c,-0.6); break;
    case 'pepper': C(4,7,3,a); C(8,7,3,a); C(6,5,3,a); C(4.5,5,1,b); R(5.5,1,1,3,c); break;
    case 'oval': E(6,7,3,5,a); C(5,5,1,b); R(5,1,2,2,c); break;
    case 'long': g.save(); g.translate(6,6); g.rotate(-0.8); E(0,0,2.2,5.5,a); E(-0.7,-1,0.6,2.5,b); g.restore(); C(9.5,2,1.5,c); break;
    case 'pod': g.save(); g.translate(6,6); g.rotate(0.6); E(0,0,2.5,5.5,a); for(let i=-1;i<=1;i++) C(0,i*3,1,b); g.restore(); break;
    case 'mushroom': C(6,5,5,a); R(1,5,10,1,a); R(4,6,4,5,b); C(4,3,1,b); C(8,4,1,b); break;
    case 'corn': E(6,6,3,5.5,a); for(let y=2;y<11;y+=2) for(let x=4;x<9;x+=2) R(x,y,1,1,b); T([3,11,0,6,4,4],c); T([9,11,12,6,8,4],c); break;
    case 'egg': E(6,7,5.5,4,'#ffffff'); C(6,7,2.5,a); break;
    case 'cone': T([2,5,10,5,6,12],b); C(6,4,4,a); C(5,3,1,'#ffffff'); break;
    case 'cup': T([2,3,10,3,8,11,4,11],b); T([3,4,9,4,7.5,9,4.5,9],a); R(7,0,1,5,c); break;
    case 'bar': R(3,0,6,9,a); R(4,1,2,3,b); R(5.5,9,1,3,'#c8a060'); break;

function checkConditions(roundStart){
  if(!S||level.def.bonus) return;
  for(const cnd of ITEM_CONDS){
    if(cnd.count){ const store=cnd.persist?P.next:S.next; if(store[cnd.id]===undefined) store[cnd.id]=cnd.every; const v=cnd.count();
      if(v>=store[cnd.id]){ store[cnd.id]+=cnd.every; queueItem(cnd.id,cnd.now); if(cnd.persist) saveP(); } }
    else { const key=cnd.perRound? cnd.id+'@'+round : cnd.id; if(S.done[key]) continue; if(cnd.now && !roundStart) continue; if(cnd.at()){ S.done[key]=true; queueItem(cnd.id,cnd.now); } }
  }
}

function queueItem(id,now){ if(now) spawnItem(id); else if(!itemQueue.includes(id)) itemQueue.push(id); }
function walkableSpot(){
  const spots=[]; for(let r=4;r<LH-1;r++) for(let c=3;c<LW-3;c++) if(solidAt(c,r)&&!solidAt(c,r-1)&&!solidAt(c,r-2)&&tileAt(c,r-1)==='.'&&level.grid[r][c]!=='H') spots.push([c,r]);
  if(!spots.length) return {x:level.spawn.x,y:level.spawn.y-16};
  const [c,r]=spots[Math.floor(Math.random()*spots.length)]; return {x:c*TILE+4,y:r*TILE};
}
function spawnItem(id){
  const def=SPECIALS[id]; if(!def) return; const s=walkableSpot();
  items.push({id,def,name:def.name,value:def.value,x:s.x,y:s.y-2,w:12,h:12,vx:0,vy:0,life:(id==='silverDoor'||id==='goldDoor'||id==='drug')?1e9:1500,onGround:false,hitWall:false,age:0});

function spawnBig(def){

  items.push({id:'big',def,name:def.name,value:def.value,big:true,size,x:LW*TILE/2,y:3*TILE+size/2,vy:0.35,life:1e9,age:0});

function updateItems(){
  itemTimer--;
  if(itemQueue.length && itemTimer<=0 && !items.some(i=>!i.big) && !bonusActive){ spawnItem(itemQueue.shift()); itemTimer= crystalBallT>0? 60 : 300; }
  for(const it of items){
    it.age++; it.life--;
    if(it.big){ const rest=(LH-1)*TILE-it.size/2; if(it.y<rest){ it.y=Math.min(rest,it.y+it.vy); }
      for(const p of players){ if(p.state!=='alive') continue; if(p.x>it.x-it.size/2 && p.x<it.x+it.size/2 && p.y>it.y-it.size/2 && p.y-p.h<it.y+it.size/2){ collectItem(it,p); break; } }
      continue; }
    it.hitWall=false; physicsStep(it);
    for(const p of players){ if(p.state==='alive' && it.age>10 && rectOverlap(p,it,0)){ collectItem(it,p); break; } }
  }

}
function collectItem(it,p){

  S.specials++; applyItem(it.id,p);

    case 'silverDoor': pendingSecret=true; enterExit(p); banner={text:'SECRET ROOM!',t:150}; break;

function skipRounds(n){ round=Math.min(LEVEL_DEFS.length-1,round+n-1); state='clear'; clearTimer=120; banner={text:'PARASOL!  SKIP '+n+' ROUNDS',t:150}; SFX.clear(); }
// kill-all miracles: a spectacle plus every monster popped in a chain (so the food escalates), bosses take a beating
function killAll(kind){
  fx.push({kind,t:0,max:100});
  if(kind==='quake') quakeT=70;
  const victims=enemies.filter(e=>e.state==='alive'&&!e.trapped);
  killQueue.push(...victims.map(e=>({e,kind})));
  for(const b of bubbles) if(b.enemy) killQueue.push({e:b.enemy,kind,bubble:b});
  SFX.escape();
}
function killWith(e,kind,popper,chain){
  if(e.state!=='alive') return;
  if(e.boss){ e.hit({x:e.x,y:e.y-8,r:8}); return; }
  const b=bubbles.find(o=>o.enemy===e); if(b){ const i=bubbles.indexOf(b); if(i>=0) bubbles.splice(i,1); }
  killEnemy(e,chain||{count:0,kills:0},popper||null,{x:e.x,y:e.y-8});
  if(kind==='water') S.waterKills++; else if(kind==='fire') S.fireKills++; else if(kind==='thunder') S.thunderKills++; else if(kind==='sky') S.skyKills++;
}
function onRoundWon(){
  if(round===LEVEL_DEFS.length){ P.cleared++; saveP(); }
  if(!roundEndItem) return;
  const {def,big}=roundEndItem; roundEndItem=null;
  for(const b of bubbles.slice()){ if(b.popping||b.enemy||b.special) continue; const i=bubbles.indexOf(b); bubbles.splice(i,1);
    fruits.push({x:b.x,y:b.y,w:10,h:12,vx:0,vy:-0.5,def,value:def.value,age:0,dead:false,onGround:false,hitWall:false}); spawnPopParticles(b,'#ffffff'); }
  if(big) spawnBig(big);
}
function startBonusFill(def){

// ---- special bubbles: water, fire, thunder and EXTEND letters float in from below ----
const SPECIAL_BUBBLE_COLORS={water:[80,160,255],fire:[255,120,40],thunder:[255,230,60],extend:[200,120,255]};
const LETTERS=[['E1','E','#ff4040'],['X','X','#ffe040'],['T','T','#40e0ff'],['E2','E','#40e040'],['N','N','#ff80c0'],['D','D','#c0c0ff']];
function spawnSpecialBubble(kind,fromTop){
  if(!kind){ if(Math.random()<1/4096){ spawnItem('specialBubble'); return; } const r=Math.random(); kind= r<0.3?'water' : r<0.55?'fire' : r<0.8?'thunder' : 'extend'; }
  const cols=[]; for(let c=3;c<LW-3;c++) if(tileAt(c,LH-2)==='.'||tileAt(c,LH-2)==='w') cols.push(c);
  const c=cols.length? cols[Math.floor(Math.random()*cols.length)] : Math.floor(LW/2);
  const b={x:c*TILE+4,y: fromTop? rnd(4*TILE,LH*TILE-4*TILE) : (LH-2)*TILE+4,r:BUB_R,vx:0,vy:-0.25,phase:'float',age:0,owner:null,enemy:null,trapT:0,popping:false,popDelay:0,popper:null,chain:null,seed:Math.random()*100,atTop:false,squash:0,slideDir:0,blockedUp:false,special:kind};
  if(kind==='extend'){ b.letter=LETTERS[Math.floor(Math.random()*LETTERS.length)]; }
  bubbles.push(b);
}
function popSpecial(b,p){
  const i=bubbles.indexOf(b); if(i>=0) bubbles.splice(i,1);
  const col=SPECIAL_BUBBLE_COLORS[b.special]; spawnPopParticles(b,`rgb(${col[0]},${col[1]},${col[2]})`); SFX.pop(3);
  const away=-(p?p.facing:1)||1;
  if(b.special==='water'){ S.waterPopped++; floods.push({x:b.x,y:b.y+4,w:12,h:8,vx:away*1.6,vy:0,life:420,onGround:false,hitWall:false,popper:p}); }
  else if(b.special==='fire'){ S.firePopped++; const c0=col_(b.x); let r=row(b.y); while(r<LH-1&&!solidAt(c0,r)) r++;
    for(let dc=-4;dc<=4;dc++){ const c=c0+dc; if(c<2||c>LW-3) continue; if(solidAt(c,r)&&!solidAt(c,r-1)) flames.push({c,r:r-1,life:220+Math.abs(dc)*8,popper:p}); } }
  else if(b.special==='thunder'){ S.thunderPopped++; bolts.push({x:b.x,y:b.y,vx:away*5,life:70,popper:p,kind:'thunder'}); }
  else if(b.special==='extend'){ const [k,ch]=b.letter; S.letters[k]++; p.extend[k]=true; addPopup(b.x,b.y-10,ch,b.letter[2]);
    if(LETTERS.every(L=>p.extend[L[0]])){ p.extend={}; p.score+=10000; p.lives++; banner={text:'EXTEND!  +10000',t:150}; SFX.clear(); } }
}
const col_=x=>Math.floor(x/TILE);
function shootFireball(p){ fireballs.push({x:p.x+p.facing*8,y:p.y-8,vx:p.facing*3.2,life:75,owner:p,dir:p.facing}); SFX.blow(); }

// ---- per-frame update of everything above ----
function updateItemSystems(){
  if(freezeT>0) freezeT--; if(heartT>0) heartT--; if(quakeT>0) quakeT--;
  roundT++;
  if(!hurried && roundT>3600 && !bonusActive && !level.def.bonus){ hurried=true; banner={text:'HURRY UP!!',t:150}; for(const e of enemies) e.angry=true; P.hurryUps++; saveP(); SFX.escape(); }
  if(!bonusActive && !level.def.bonus){ specialBubbleT--; if(specialBubbleT<=0 && bubbles.filter(b=>b.special).length<3){ specialBubbleT=420+Math.random()*300; spawnSpecialBubble(); } }
  if(frameCount%30===0) checkConditions(false);
  updateItems();
  // staggered kill-all
  if(killQueue.length && frameCount%5===0){ const k=killQueue.shift(); if(k.e.state==='alive'){ killQueue.chain=killQueue.chain||{count:0,kills:0}; killWith(k.e,k.kind,null,killQueue.chain); } if(!killQueue.length) killQueue.chain=null; }
  // floods: a wave that runs along the floor away from the popper, falls off ledges, bounces off walls
  for(const f of floods){ f.life--; f.hitWall=false; physicsStep(f); if(f.hitWall) f.vx=-f.vx;
    if(frameCount%2===0) particles.push({type:'dot',x:f.x+rnd(-6,6),y:f.y-rnd(0,8),vx:-f.vx*0.3,vy:rnd(-0.8,0),life:14,max:14,color:'#80c8ff'});
    for(const e of enemies) if(e.state==='alive'&&!e.trapped&&rectOverlap(f,e,0)) killWith(e,'water',f.popper); }
  floods=floods.filter(f=>f.life>0);
  for(const fl of flames){ fl.life--; for(const e of enemies){ if(e.state!=='alive'||e.trapped) continue; if(col_(e.x)===fl.c && row(e.y-1)===fl.r) killWith(e,'fire',fl.popper); } }
  flames=flames.filter(f=>f.life>0);
  for(const bt of bolts){ bt.life--; bt.x+=bt.vx; if(solidAt(col_(bt.x),row(bt.y))) bt.life=0;
    for(const e of enemies){ if(e.state!=='alive'||e.trapped) continue; if(Math.abs(e.x-bt.x)<10 && Math.abs((e.y-8)-bt.y)<12) killWith(e,'thunder',bt.popper); } }
  bolts=bolts.filter(b=>b.life>0);
  for(const fb of fireballs){ fb.life--; fb.x+=fb.vx; if(solidAt(col_(fb.x),row(fb.y))) fb.life=0;
    for(const e of enemies){ if(e.state!=='alive'||e.trapped) continue; if(Math.abs(e.x-fb.x)<10 && Math.abs((e.y-8)-fb.y)<12){ killWith(e,'fireball',fb.owner,{count:0,kills:0}); fb.life=0; } } }
  fireballs=fireballs.filter(b=>b.life>0);
  for(const eb of energyBalls){ eb.life--; const nx=eb.x+eb.vx, ny=eb.y+eb.vy; if(solidAt(col_(nx),row(eb.y))||nx<2*TILE||nx>LW*TILE-2*TILE) eb.vx=-eb.vx; else eb.x=nx;
    if(solidAt(col_(eb.x),row(ny))||ny<3*TILE||ny>LH*TILE-TILE) eb.vy=-eb.vy; else eb.y=ny;
    if(frameCount%3===0) particles.push({type:'dot',x:eb.x+rnd(-2,2),y:eb.y+rnd(-2,2),vx:0,vy:0,life:12,max:12,color:'#ff80c0'});
    for(const e of enemies){ if(e.state==='alive'&&!e.trapped&&Math.hypot(e.x-eb.x,e.y-8-eb.y)<12) killWith(e,'ball',null,{count:0,kills:0}); } }
  energyBalls=energyBalls.filter(b=>b.life>0);
  if(skyfall){ skyfall.t++; if(skyfall.t%6===0 && skyfall.n>0){ skyfall.n--; const def=skyfall.pool[Math.floor(Math.random()*skyfall.pool.length)];
      fruits.push({x:rnd(3*TILE,LW*TILE-3*TILE),y:3*TILE,w:10,h:12,vx:0,vy:1.2,def,value:def.value,age:0,dead:false,onGround:false,hitWall:false,lethal:true}); }
    if(skyfall.n<=0) skyfall=null; }
  for(const f of fruits){ if(f.lethal){ if(f.onGround) f.lethal=false; else for(const e of enemies) if(e.state==='alive'&&!e.trapped&&rectOverlap(f,e,0)) killWith(e,'sky',null); } }
  for(const x of fx){ x.t++;

function powersText(){

// ===================== rounds =====================
function startGame(startAt=1){
  players=[new Player(0)]; if(numPlayers===2) players.push(new Player(1)); player=players[0]; round=startAt; stats={blown:0,popped:0,bounces:0,biggestChain:0};
  S=newS(); P.gamesBegun++; P.p1Joins++; if(numPlayers===2) P.p2Joins++; saveP(); itemQueue=[]; thunderMode=false; pendingSecret=false; nextExtend=0; bellArmed=false; crystalBallT=0; roundEndItem=null;
  startRound(); state='playing'; paused=false;
}
function startRound(customDef){
  level=makeLevel(customDef||defOf(round-1)); LW=level.cols; LH=level.rows; buildLevel();
  enemies=[]; bubbles=[]; fruits=[]; particles=[]; popups=[]; spawnQueue=[]; shots=[]; exitOpen=false; ambient=[]; windT=0;
  bossRound=(round%BOSS_EVERY===0) && !level.def.bonus; bossSpawned=false; bonusActive=false;
  const screens=level.def.sw*level.def.sh;
  const n=Math.max(3,Math.min(level.enemies.length, level.def.sw*level.def.sh>=16 ? 40 : Math.round(3+round*0.5+screens*2.5)));
  const pool=typePool();
  for(let i=0;i<n;i++){ const s=level.enemies[i%level.enemies.length]; spawnQueue.push({t:40+i*30,x:s.x,y:s.y,type:pool[Math.floor(Math.random()*pool.length)]}); }
  roundTotal=n;
  banner={text:'ROUND '+round+'  '+level.def.name,t:150};
  if(level.def.bonus) setupBonus();
  for(const p of players) p.reset();
  camSnap=true; updateCamera();
  // items and effects for the new round
  items=[]; fx=[]; floods=[]; flames=[]; bolts=[]; fireballs=[]; energyBalls=[]; skyfall=null; killQueue=[]; freezeT=0; heartT=0; roundT=0; hurried=false; quakeT=0; itemTimer=150; specialBubbleT=360;
  for(const p of players){ p.stageRings=false; p.stageCandies=false; if(!customDef && p.fireballRounds>0) p.fireballRounds--; }
  if(!customDef){ S.crownPrev=S.crownThis; S.crownThis=false; P.levelsBegun++; if(crystalBallT>0) crystalBallT--; saveP(); }
  if(!level.def.bonus){ checkConditions(true);
    if(nextExtend>0){ for(let i=0;i<nextExtend;i++) spawnSpecialBubble('extend',true); nextExtend=0; }
    if(bellArmed && itemQueue.some(id=>KILL_ALL.has(id))){ bellArmed=false; banner={text:'THE BELL TOLLS...',t:150}; SFX.clear(); } }
}
function setupBonus(){
  bonusActive=true; bonusTimer=BONUS_TIME; spawnQueue=[]; roundTotal=0; fruits=[];
  const food=level.def.dessert;
  for(let r=3;r<LH-1;r++) for(let c=3;c<LW-3;c++){
    if(solidAt(c,r)&&!solidAt(c,r-1)&&!solidAt(c,r-2)&&(c%2===0)&&Math.random()<0.75) fruits.push({x:c*TILE+4,y:r*TILE,w:10,h:12,vx:0,vy:0,def:food,value:food.value,age:100,dead:false,onGround:true,hitWall:false,permanent:true}); }
  bonusTotal=fruits.length;
  banner={text:level.def.name,t:180};
}
function endBonus(){
  const all=fruits.length===0; fruits=[]; bonusActive=false; state='clear'; clearTimer=150;
  banner={text: all?'PERFECT!  +10000':'TIME UP!',t:150}; if(all) for(const p of players) p.score+=10000; SFX.clear();
}
function update(){
  frameCount++;
  pollPads();
  { const g=padState[0]||padState[1]; if(g){
      if(state==='title'){ const N=LEVEL_DEFS.length; if(g.upP||g.downP){ selLevel=(selLevel+(g.upP?-1:1)+N)%N; try{ localStorage.setItem('bb_level',String(selLevel)); }catch(e){} }
        if(g.leftP||g.rightP){ numPlayers=numPlayers===1?2:1; try{ localStorage.setItem('bb_players',String(numPlayers)); }catch(e){} }
        if(g.startP||g.jumpP){ initAudio(); startGame(selLevel+1); } }
      else if(state==='gameover' && g.startP) startGame(selLevel+1);
      else if(state==='playing' && g.startP) paused=!paused; } }
  if(state==='playing' && !paused){
    for(const s of spawnQueue){ if(--s.t<=0){ enemies.push(new Enemy(s.x,s.y,s.type)); s.done=true; SFX.spawn(); } }
    spawnQueue=spawnQueue.filter(s=>!s.done);
    for(const p of players) p.update();
    for(const e of enemies) e.update();
    enemies=enemies.filter(e=>e.state!=='dead');
    updateShots();
    updateItemSystems();
    for(const b of bubbles.slice()) updateBubble(b);
    resolveBubbles();
    for(const f of fruits) updateFruit(f); fruits=fruits.filter(f=>!f.dead);
    updateParticles(); updateAmbient();
    for(const p of players) if(p.score>hiScore) hiScore=p.score;
    if(banner && --banner.t<=0) banner=null;
    if(bonusActive){ bonusTimer--; if(bonusTimer<=0 || fruits.length===0) endBonus(); }
    else if(!exitOpen && enemies.length===0 && spawnQueue.length===0){
      if(bossRound && !bossSpawned) spawnBoss();
      else { exitOpen=true; SFX.clear(); banner={text:'EXIT OPEN!',t:150}; onRoundWon(); } }
    updateCamera();
  } else if(state==='clear'){
    clearTimer--;
    if(clearTimer%3===0 && bubbles.length){ const b=bubbles[bubbles.length-1]; if(!b.popping) startPop(b,null,false); }
    for(const b of bubbles.slice()) updateBubble(b);
    resolveBubbles();
    for(const f of fruits) updateFruit(f); fruits=fruits.filter(f=>!f.dead);
    updateParticles(); updateAmbient(); updateItems();
    if(banner && --banner.t<=0) banner=null;
    if(clearTimer<=0){ if(pendingSecret){ pendingSecret=false; startSecretRoom(); } else { round++; startRound(); } state='playing'; }
  } else if(state==='gameover'){
    updateParticles();
    for(const b of bubbles.slice()) updateBubble(b); resolveBubbles();
  }
  for(const k in pressed) pressed[k]=false;
}

// ===================== weather: wind gusts and ambient particles =====================
let ambient=[], windT=0;
// gusts come and go: a long lull, then a swell that peaks and dies, alternating direction each time
function windNow(){ const w=level&&level.def&&level.def.wind; if(!w) return 0; const per=560, cyc=windT%per; if(cyc<320) return 0; const dir=(Math.floor(windT/per)%2)?-1:1; return dir*w*Math.sin((cyc-320)/240*Math.PI); }
function updateAmbient(){
  const th=level.def.theme; windT++;
  if(th==='ice'&&frameCount%3===0) ambient.push({k:'snow',x:rnd(-10,W+10),y:14,vx:rnd(-0.2,0.2),vy:rnd(0.3,0.7),life:600,s:rnd(0,6)});
  if(th==='fire'&&frameCount%4===0) ambient.push({k:'ember',x:rnd(0,W),y:H+2,vx:rnd(-0.3,0.3),vy:rnd(-0.9,-0.4),life:rnd(80,220),s:rnd(0,6)});
  if(th==='forest'&&frameCount%14===0) ambient.push({k:'leaf',x:rnd(-10,W+10),y:14,vx:rnd(-0.3,0.3),vy:rnd(0.25,0.5),life:700,s:rnd(0,6),c:['#7ee070','#e0c040','#c05030'][Math.floor(rnd(0,3))]});
  if(th==='space'&&frameCount%6===0) ambient.push({k:'twinkle',x:rnd(0,W),y:rnd(18,H),vx:0,vy:0,life:20,s:0});
  const wd=windNow(); if(Math.abs(wd)>0.12&&frameCount%2===0) ambient.push({k:'streak',x:wd>0?-20:W+20,y:rnd(18,H),vx:wd*7,vy:0,life:90,s:0});
  for(const a of ambient){ a.life--; a.x+=a.vx+((a.k==='snow'||a.k==='leaf')?Math.sin(frameCount*0.05+a.s)*0.3:0)+(a.k!=='streak'?wd*1.5:0); a.y+=a.vy; if(a.y>H+4||a.y<10||a.x<-40||a.x>W+40) a.life=0; }
  ambient=ambient.filter(a=>a.life>0);
}
function drawAmbient(){
  for(const a of ambient){ const x=Math.round(a.x), y=Math.round(a.y);
    if(a.k==='snow'){ ctx.fillStyle='rgba(255,255,255,0.85)'; const s=a.s>3?2:1; ctx.fillRect(x,y,s,s); }
    else if(a.k==='ember'){ ctx.fillStyle=((frameCount+a.s*3)%6<3)?'#ffb040':'#ff5010'; ctx.fillRect(x,y,1,1); }
    else if(a.k==='leaf'){ ctx.fillStyle=a.c; ctx.fillRect(x,y,2,1); }
    else if(a.k==='twinkle'){ ctx.fillStyle=`rgba(255,255,255,${(a.life/20).toFixed(2)})`; ctx.fillRect(x,y,1,1); }
    else if(a.k==='streak'){ ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fillRect(x,y,12,1); } }
}

const texts=[]; // drawn on the display canvas at 3x (crisp web font)
function text(str,x,y,color,size=8,align='left'){ texts.push({str,x,y,color,size,align}); }
const OUTLINE_COLORS=['#f8f8f8','#f8e030','#60e0ff','#ff80c0','#ff5050'];
function drawBubble(b){
  const wob=Math.sin(b.age*0.12+b.seed)*0.05;
  const sx=1+wob+b.squash*0.18, sy=1-wob-b.squash*0.18;
  const warn = b.enemy ? b.trapT>BUB_ESCAPE-BUB_WARN : b.age>BUB_LIFE-BUB_WARN;
  const flash = warn && ((frameCount>>3)&1);
  ctx.save(); ctx.translate(b.x,b.y); ctx.scale(sx,sy);
  const base = flash ? [255,80,80] : b.special? SPECIAL_BUBBLE_COLORS[b.special] : [60,225,90];
  ctx.beginPath(); ctx.arc(0,0,b.r-0.5,0,Math.PI*2);
  ctx.fillStyle=`rgba(${base[0]},${base[1]},${base[2]},${b.enemy?0.5:0.45})`; ctx.fill();
  if(b.enemy){
    // the captive: shrunk to fit, squashed and wobbling as it struggles, faster as the bubble is about to burst
    const struggle = b.trapT>BUB_ESCAPE-BUB_WARN ? 0.3 : 0.15;
    const wob2=Math.sin(b.age*struggle+b.seed);
    const ex=0.72+wob2*0.09, ey=0.72-wob2*0.09;
    const img=frame(b.enemy.type.spr+'_walk',(b.trapT>>3)%2? 1:0, wob2>0?1:-1);
    if(img){ ctx.save(); ctx.scale(ex,ey); ctx.drawImage(img,-8,-7); ctx.restore(); }
    // tint the captive with the bubble colour so it reads as being inside
    ctx.beginPath(); ctx.arc(0,0,b.r-0.5,0,Math.PI*2);
    ctx.fillStyle=`rgba(${base[0]},${base[1]},${base[2]},0.28)`; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(-1.5,1.5,b.r-3.5,0,Math.PI*2);
  ctx.fillStyle=`rgba(${base[0]+60},${Math.min(255,base[1]+30)},${base[2]+60},${b.enemy?0.18:0.35})`; ctx.fill();
  ctx.lineWidth=1.2;
  ctx.strokeStyle= flash ? '#ff4040' : OUTLINE_COLORS[(b.age>>3)%OUTLINE_COLORS.length];
  ctx.beginPath(); ctx.arc(0,0,b.r-0.6,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.fillRect(-4,-5,2,1); ctx.fillRect(-5,-4,1,2);
  if(b.special==='water'){ ctx.fillStyle='#e0f4ff'; ctx.fillRect(-3,0,6,1); ctx.fillRect(-2,-2,2,1); ctx.fillRect(1,-2,2,1); }
  else if(b.special==='fire'){ ctx.fillStyle='#ffe060'; ctx.fillRect(-1,-3,2,6); ctx.fillStyle='#ff4020'; ctx.fillRect(-3,0,6,3); ctx.fillStyle='#ffe060'; ctx.fillRect(-1,1,2,2); }
  else if(b.special==='thunder'){ ctx.fillStyle='#ffffff'; ctx.fillRect(0,-4,2,3); ctx.fillRect(-2,-1,4,2); ctx.fillRect(-1,1,2,3); }
  ctx.restore();
  if(b.special==='extend') text(b.letter[1],b.x-cam.x,b.y-cam.y+1,b.letter[2],6,'center');
}

function drawFluids(cx,cy){
  const c0=Math.max(0,col(cx)), c1=Math.min(LW-1,col(cx+W)+1), r0=Math.max(0,row(cy)), r1=Math.min(LH-1,row(cy+H)+1);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    const t=level.grid[r][c]; if(t!=='w'&&t!=='F'&&t!=='f'&&t!=='L'&&t!=='H') continue; const x=c*TILE, y=r*TILE;
    if(t==='L'){
      // lava: a rolling crust with flame tongues leaping off the surface
      const ph=Math.sin(frameCount*0.06+c*0.7);
      ctx.fillStyle='#c02800'; ctx.fillRect(x,y,TILE,TILE); ctx.fillStyle='#ff5a00'; ctx.fillRect(x,y+1,TILE,3);
      ctx.fillStyle='#ffb020'; ctx.fillRect(x+((c*3+(frameCount>>3))%6),y+2,2,1);
      if(tileAt(c,r-1)!=='L'){
        ctx.fillStyle='#ffe060'; ctx.fillRect(x,y+(ph>0?0:1),TILE,1);
        const fh=2+Math.round(Math.abs(Math.sin(frameCount*0.13+c*1.7))*5), fx=x+1+((c*5+(frameCount>>4))%5);
        ctx.fillStyle='#ff7a10'; ctx.fillRect(fx,y-fh,2,fh); ctx.fillStyle='#ffe060'; ctx.fillRect(fx,y-fh,2,Math.max(1,fh>>1));
        const fh2=1+Math.round(Math.abs(Math.sin(frameCount*0.17+c*2.3+1))*3); ctx.fillStyle='#ff9a20'; ctx.fillRect(x+5-((c+(frameCount>>3))%3),y-fh2,1,fh2);
        ctx.fillStyle='rgba(255,120,0,0.16)'; ctx.fillRect(x,y-16,TILE,16);
      }
    } else if(t==='H'){
      // hot platform: three flickering flames dancing on the coals
      if(!solidAt(c,r-1)){
        for(let k=0;k<3;k++){ const fh=2+Math.round(Math.abs(Math.sin(frameCount*0.21+c*1.9+k*2.1))*4), fx=x+k*3;
          ctx.fillStyle=k===1?'#ffd030':'#ff6a10'; ctx.fillRect(fx,y-fh,2,fh); ctx.fillStyle='#fff0a0'; ctx.fillRect(fx,y-fh,2,1); }
        ctx.fillStyle='rgba(255,140,0,0.12)'; ctx.fillRect(x-1,y-10,TILE+2,10);
      }
    } else if(t==='F' && level.def.theme==='fire'){
      // fire geyser: a column of rising flame
      ctx.fillStyle='rgba(255,100,0,0.3)'; ctx.fillRect(x,y,TILE,TILE);
      const o=(frameCount*3+c*5)%8, o2=(o+4)%8; ctx.fillStyle='#ffd040'; ctx.fillRect(x+2,y+7-o,1,2); ctx.fillRect(x+5,y+7-o2,1,2); ctx.fillStyle='#ff6a10'; ctx.fillRect(x+3,y+7-((o+2)%8),2,1); ctx.fillRect(x+1,y+7-((o+6)%8),1,1);
    } else if(t==='f'){
      ctx.fillStyle='rgba(90,170,255,0.32)'; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle='rgba(235,250,255,0.85)'; const o=(frameCount*3+c*5)%8; ctx.fillRect(x+2,y+o,1,2); ctx.fillRect(x+5,y+(o+4)%8,1,2); ctx.fillRect(x+3,y+(o+6)%8,1,1);
    } else if(t==='w'){
      ctx.fillStyle='rgba(40,110,255,0.42)'; ctx.fillRect(x,y,TILE,TILE);
      const above=tileAt(c,r-1); if(above!=='w'&&above!=='f'){ const ph=Math.sin(frameCount*0.08+c*0.9)>0?0:1; ctx.fillStyle='rgba(210,245,255,0.85)'; ctx.fillRect(x,y+ph,TILE,1); }
    } else {
      ctx.fillStyle='rgba(120,200,255,0.28)'; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle='rgba(255,255,255,0.8)';
      const o=(frameCount*3+c*5)%8, o2=(o+4)%8; ctx.fillRect(x+2,y+7-o,1,1); ctx.fillRect(x+5,y+7-o2,1,1); ctx.fillRect(x+3,y+7-((o+2)%8),1,1);
    }
  }
}
function render(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  texts.length=0;
  if(state!=='title'){
    const cx=Math.round(cam.x)+(quakeT>0?Math.round(rnd(-3,3)):0), cy=Math.round(cam.y)+(quakeT>0?Math.round(rnd(-2,2)):0);
    ctx.save(); ctx.translate(-cx,-cy);
    ctx.drawImage(levelCanvas,0,0);
    drawExit(cx,cy);
    for(const k of level.keys){ if(k.taken) continue; const bob=Math.round(Math.sin(frameCount*0.1+k.x)*1.5); ctx.drawImage(KEY_IMGS[k.id]||KEY_IMGS[1],Math.round(k.x-4),Math.round(k.y-8+bob)); if((frameCount>>3)&1){ ctx.fillStyle='#ffffff'; ctx.fillRect(Math.round(k.x-4)+(frameCount>>2)%7,Math.round(k.y-9+bob),1,1); } }
    for(const f of fruits){ if(f.age>840 && !f.permanent && ((frameCount>>2)&1)) continue; ctx.drawImage(f.def.img,Math.round(f.x-6),Math.round(f.y-12),12,12); }
    drawItems();
    for(const e of enemies) e.draw();
    drawShots();
    for(const b of bubbles) if(!b.popping) drawBubble(b);
    drawEffectsWorld();
    for(const p of players) p.draw();
    drawFluids(cx,cy);
    for(const p of particles){
      const a=p.life/p.max;
      if(p.type==='ring'){ ctx.strokeStyle=p.color; ctx.globalAlpha=a; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1; }
      else { ctx.fillStyle=p.color; ctx.globalAlpha=Math.min(1,a*1.5); ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1); ctx.globalAlpha=1; }
    }
    ctx.restore();
    drawEffectsScreen();
    drawAmbient();
    { const wd=windNow(); if(Math.abs(wd)>0.1) text(wd>0?'WIND >>':'<< WIND',128,26,'#c0e0ff',5,'center'); }
    for(const t of popups) text(t.text,t.x-cx,t.y-cy,t.color,6,'center');
    // lives (bottom-left) and enemies remaining (bottom-right) as screen overlays
    const life=frame('bub_walk',0,1);
    if(life){ if(INFINITE_LIVES){ ctx.drawImage(life,2,H-9,8,8); text('INF',18,H-5,'#ffffff',5,'center'); } else for(let i=0;i<player.lives-1;i++) ctx.drawImage(life,2+i*9,H-9,8,8); }
    drawMinimap(cx,cy);
    // arrow toward the open exit when it is off-screen
    const bossT=enemies.find(e=>e.boss&&e.state==='alive');
    if(exitOpen||bossT){
      const ex=(exitOpen?level.exit.x+8:bossT.x)-cx, ey=(exitOpen?level.exit.y+8:bossT.y-10)-cy;
      if((ex<0||ex>W||ey<16||ey>H) && ((frameCount>>3)&1)){
        const ax=clamp(ex,10,W-10), ay=clamp(ey,26,H-14), ang=Math.atan2(ey-ay,ex-ax);
        ctx.save(); ctx.translate(ax,ay); ctx.rotate(ang); ctx.fillStyle=exitOpen?'#40ff40':'#ff5050';
        ctx.beginPath(); ctx.moveTo(7,0); ctx.lineTo(-4,-5); ctx.lineTo(-4,5); ctx.closePath(); ctx.fill(); ctx.restore();
      }
    }
  } else {
    ctx.drawImage(levelCanvas,0,0);
  }
  // HUD
  text('1UP',36,7,'#40ff40',8,'center');
  text(String(state==='title'?0:player.score).padStart(6,'0'),36,15,'#ffffff',8,'center');
  text('HIGH SCORE',128,7,'#ff4040',8,'center');
  text(String(hiScore).padStart(6,'0'),128,15,'#ffffff',8,'center');
  const twoP = state!=='title' && players.length===2;
  if(twoP){ text('2UP',220,7,'#4080ff',8,'center'); text(String(players[1].score).padStart(6,'0'),220,15,'#ffffff',8,'center'); }
  if(state==='title'){
    text('2UP',220,7,'#4080ff',8,'center'); text('000000',220,15,numPlayers===2?'#ffffff':'#606060',8,'center');
  } else if(bonusActive){
    if(twoP){ text('TIME '+String(Math.max(0,Math.ceil(bonusTimer/60))).padStart(2,'0')+'   '+(bonusTotal-fruits.length)+'/'+bonusTotal,128,25,'#f8e030',5,'center'); }
    else { text('TIME',214,7,'#f8e030',6,'center'); text(String(Math.max(0,Math.ceil(bonusTimer/60))).padStart(2,'0'),214,16,'#ffffff',8,'center');
      text((bonusTotal-fruits.length)+'/'+bonusTotal,246,25,'#ffffff',5,'right'); }
  } else {
    // enemy gauge: bar drains and the number counts down to zero (tucked under the high score when two are playing)
    const left=enemiesLeft(), total=Math.max(1,roundTotal), frac=left/total;
    const gx= twoP? 104 : 186, gy= twoP? 23 : 11, gw= twoP? 40 : 46, gh= twoP? 5 : 7;
    if(!twoP) text('ENEMIES',214,7,'#4080ff',6,'center');
    ctx.fillStyle='#181828'; ctx.fillRect(gx,gy,gw,gh);
    ctx.fillStyle='#303050'; ctx.fillRect(gx+1,gy+1,gw-2,gh-2);
    if(left>0){ ctx.fillStyle= frac>0.5?'#40e040': frac>0.25?'#f8e030':'#ff5050'; ctx.fillRect(gx+1,gy+1,Math.max(2,Math.round((gw-2)*frac)),gh-2); }
    const zi=frame('zen_walk',0,-1); if(zi && left>0){ ctx.drawImage(zi,gx-8,gy,7,7); }

    text(String(left).padStart(2,'0'),twoP?gx+gw+8:243,twoP?gy+3:15,left===0?(flash?'#40ff40':'#ffffff'):'#ffffff',twoP?6:8,'center');
  }

  if(state==='playing'||state==='clear'){ const pt=powersText(); if(pt) text(pt,128,H-5,'#ffd040',5,'center'); }
  if(state!=='title') text(String(round),8,26,'#f8e030',8,'center');
  if(twoP){ const b2=frame('bob_walk',0,1); if(b2) ctx.drawImage(b2,W-10,H-9,8,8); }

  { const bz=state!=='title' && enemies.find(e=>e.boss&&e.state!=='dead'); if(bz){ text('BOSS',128,H-15,'#ff5050',6,'center'); ctx.fillStyle='#181828'; ctx.fillRect(88,H-10,80,7); ctx.fillStyle='#402020'; ctx.fillRect(89,H-9,78,5); ctx.fillStyle=(bz.hurtT>0)?'#ffffff':'#ff4040'; ctx.fillRect(89,H-9,Math.max(0,Math.round(78*bz.hp/bz.maxHp)),5); } }
  if(paused) text('PAUSED',128,120,'#ffffff',8,'center');
  if(state==='gameover'){ text('GAME OVER',128,104,'#ff4040',8,'center'); text('PRESS ENTER',128,122,'#ffffff',6,'center'); }
  if(state==='title'){
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(16,16,W-32,H-32);
    text('BUBBLE BOBBLE',128,34,'#f8e030',12,'center');
    text('PROTOTYPE',128,48,'#ff80c0',6,'center');
    text('NAME '+(nameEdit? (nameBuf+(((frameCount>>4)&1)?'_':' ')).padEnd(3,' ') : P.name)+'  N',236,56,nameEdit?'#40ff40':'#a0a0a0',5,'right');
    const b=frame('bub_walk',0,1); if(b) ctx.drawImage(b,26,64,24,24);
    const z=frame('zen_walk',0,-1); if(z) ctx.drawImage(z,206,64,24,24);
    text('SELECT LEVEL  W / S',128,62,'#a0a0a0',5,'center');
    const N=LEVEL_INFO.length, show=8, first=clamp(selLevel-3,0,Math.max(0,N-show));
    for(let k=0;k<show && first+k<N;k++){ const i=first+k, y=76+k*12, sel=i===selLevel;
      if(sel){ ctx.fillStyle='rgba(255,255,255,0.14)'; ctx.fillRect(52,y-6,152,12); }
      text(String(i+1).padStart(2,'0')+'  '+LEVEL_INFO[i].name,56,y,sel?'#40ff40':(LEVEL_INFO[i].bonus?'#f8e030':'#ffffff'),6,'left');
      text(LEVEL_INFO[i].size,200,y,sel?'#40ff40':(LEVEL_INFO[i].bonus?'#f8e030':'#808080'),5,'right'); }
    const b2=frame('bob_walk',0,1); if(b2 && numPlayers===2) ctx.drawImage(b2,50,64,24,24);
    text((numPlayers===1?'< 1 PLAYER >':'< 2 PLAYERS >')+'   A/D',128,168,'#f8e030',5,'center');
    if(numPlayers===1){
      text('A/D MOVE   SPACE JUMP   S+SPACE DROP',128,176,'#ffffff',5,'center');
      text('HOLD JUMP TO BOUNCE ON BUBBLES',128,186,'#a0a0a0',5,'center');
      text('E BUBBLE  F AUTOFIRE '+(autofire?'ON':'OFF')+'  M MUTE  P PAUSE',128,196,'#a0a0a0',5,'center');
    } else {

      text('GAMEPAD: A JUMP  X BUBBLE   1ST PAD IS BOB',128,196,'#a0a0a0',5,'center');

  sctx.imageSmoothingEnabled=false;

// ===================== main loop =====================
let last=performance.now(), acc=0; const STEP=1000/60;
function loop(now){
  acc+=Math.min(now-last,100); last=now;
  while(acc>=STEP){ if(ready) update(); acc-=STEP; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
